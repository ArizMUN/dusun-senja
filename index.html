<canvas id="c"></canvas>
<div id="hud"><span id="clock"></span><span id="gold"></span></div><div id="menuc" class="mv"><button id="menub" title="Menu">⚙️</button><button id="mapb" title="Peta (M)">🗺️</button><button id="qb" title="Misi (Q)">📜</button><button id="tr" title="Skill (K)">🌳</button><button id="bm" title="Bangun (B)">🔨</button><button id="bag" title="Tas (I)">🎒</button><button id="reset" title="Mulai baru">⟲</button></div>
<div id="hpb"><i id="hpf"></i><span id="hpt"></span></div><div id="mpb"><i id="mpf"></i><span id="mpt"></span></div><button id="qt" class="mv"></button><div id="skbar" class="mv"></div><div id="hbw" class="mv"><div id="binfo"></div><div id="hotbar"></div></div>
<div id="toast"></div>
<div id="layb" hidden><span>Seret tombol ke posisi yang kamu mau</span><button id="layr">Reset</button><button id="layd">Selesai</button></div>
<div id="panel" hidden></div>
<button id="atk" class="mv" title="Serang (J / F)">⚔️</button><button id="act" class="mv" title="Aksi (Spasi / E)">✋</button>
<div id="joy" class="mv"><div id="stick"></div></div>
<div id="dead" hidden><div><h2>Kamu pingsan… 💤</h2><p>Warga dusun membawamu pulang. Istirahat dulu ya, besok pagi kita coba lagi.</p><button id="wake">Bangun di rumah</button></div></div>
